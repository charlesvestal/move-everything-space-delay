name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify version match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION=$(grep '"version"' src/module.json | head -1 | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match module.json version ($MODULE_VERSION)"
            echo "Please update src/module.json to version $TAG_VERSION before tagging."
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with Docker
        run: |
          docker build -t module-builder -f scripts/Dockerfile .
          docker run --rm -v "$PWD:/build" -w /build module-builder ./scripts/build.sh

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/tapedelay-module.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit release.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git fetch origin main
          git checkout -f main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Rewrite only version + download_url. The previous version of this
          # step regenerated the file from scratch, which silently dropped
          # name / description / repo_url — fields the Module Store reads.
          REPO="${{ github.repository }}" TAG="${{ github.ref_name }}" \
          python3 - "$VERSION" <<'PY'
          import json, os, sys
          v = sys.argv[1]
          with open("release.json") as f:
              r = json.load(f)
          r["version"] = v
          r["download_url"] = (f"https://github.com/{os.environ['REPO']}"
                               f"/releases/download/{os.environ['TAG']}"
                               "/tapedelay-module.tar.gz")
          with open("release.json", "w") as f:
              json.dump(r, f, indent=2)
              f.write("\n")
          PY

          git add release.json
          git commit -m "chore: update release.json for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin main
